# 文件职责：Python 包元数据、依赖范围及 pytest/ruff 配置；锁定安装版本另见 requirements.lock。
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "human-ai-backend"
version = "0.3.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "tokenizers==0.22.2", "jinja2==3.1.6",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "pymysql>=1.1,<2",
  "pydantic-settings>=2.7,<3", "argon2-cffi>=23,<26", "PyJWT>=2.10,<3",
  "cryptography>=44", "httpx>=0.28,<1", "python-multipart>=0.0.20",
  "pillow>=11", "langgraph>=1.0,<2", "langchain-core>=1.0,<2",
  "celery[redis]>=5.5,<6", "mcp>=1.26,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "qdrant-client>=1.16,<2", "langchain-text-splitters>=1,<2", "pypdf>=6,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "pytest-cov>=6"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["tokenizer_assets/qwen3/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
